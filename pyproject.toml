[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chainlens"
version = "2.0.0"
description = "Auditable Ethereum wallet risk scoring with R1-R5, DBSCAN, Apriori, and Louvain"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1,<3",
  "numpy>=1.26,<3",
  "pyarrow>=14",
  "duckdb>=1.0",
  "scikit-learn>=1.4,<2",
  "networkx>=3.2,<4",
  "mlxtend>=0.23,<1",
  "streamlit>=1.50,<2",
  "plotly>=5.20,<8",
  "requests>=2.31,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0",
]

[project.scripts]
chainlens = "run:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools]
py-modules = ["fetch_data", "features", "patterns", "scoring", "evaluate", "run", "dashboard"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
