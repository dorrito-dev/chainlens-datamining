[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chainlens"
version = "0.1.0"
description = "Ethereum wallet risk-scoring pipeline (Phase 4 detection)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pandas>=2.1,<3",
  "numpy>=1.26,<3",
  "pyarrow>=14",
  "duckdb>=1.0",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8",
  "networkx>=3.2,<4",
  "kneed>=0.8,<1",
  "mlxtend>=0.23,<1",
  "streamlit>=1.38,<2",
  "streamlit-agraph>=0.0.45,<0.1",
  "SQLAlchemy>=2.0,<3",
  "psycopg2-binary>=2.9",
  "neo4j>=5.20,<6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.25,<4"]

[tool.setuptools.packages.find]
include = ["chainlens*"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
