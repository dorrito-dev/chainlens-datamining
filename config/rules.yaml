rules_version_label: "v0-deck"   # human reference; the DB stores a computed hash
max_score: 100

tiers:
  low_max: 24
  medium_max: 59                 # high = score > 59

downweight:
  known_address_factor: 0.3
  known_address_categories: [exchange, bridge, mixer, contract]

rules:
  - id: R1
    name: circular_flow
    weight: 25
    params:
      cycle_length_min: 3
      cycle_length_max: 5
      value_tolerance: 0.05
      time_window_hours: 24
  - id: R2
    name: fanout
    weight: 20
    params:
      fanout_threshold: 20
      min_outbound: 20
      min_ratio: 0.5
  - id: R3
    name: sanctioned_1hop
    weight: 30
    params:
      hops: 1
      seed_source: train_only
  - id: R4
    name: pagerank_top5pct
    weight: 15
    params:
      percentile: 95
  - id: R5
    name: apriori_match
    weight: 20
    params:
      min_support: 0.05
      min_lift: 2.0
      mined_on: train_only
