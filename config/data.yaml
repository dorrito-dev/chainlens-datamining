window:
  mode: label_anchored  # 'time' | 'label_anchored'; switched by the overlap gate
  block_start: 19000000   # ~1 week: 45,001 blocks
  block_end: 19045000
  reference_block_start: 18900000   # wider range used for 1-2 hop expansion
  reference_block_end: 19045000
  neighbor_hops: 2
  fallback_min_positives: 50   # if fewer labeled positives in window, switch to label_anchored

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  sample_parquet: data/sample/transactions.parquet

ingest:
  sample_mode: false      # CI/local fixture runs set CHAINLENS_SAMPLE_MODE=1
  raw_transactions: data/raw/transactions.parquet
  raw_contracts: data/raw/contracts.parquet
  labels_dir: data/labels
  labels_parquet: data/processed/labels_snapshot.parquet
  clean_parquet: data/processed/transactions_clean.parquet
  split_summary: data/processed/split_summary.json
  window_decision: data/processed/window_decision.json
  features_summary: data/processed/features_summary.json
  known_seed: config/known_addresses_seed.json
  bq_max_bytes: 1099511627776   # 1 TiB, the monthly free tier
  bq_price_per_tib_usd: 6.25

bigquery:
  export_sql: pipeline/bigquery_export.sql
  project: ${BIGQUERY_PROJECT}

neo4j:
  uri: ${NEO4J_URI}       # bolt://localhost:7687 for local Docker
